<html>
  <head>
    <title>Game tebak gambar</title>

    <link rel="stylesheet" href="game.css">

    <style>
        #tebakan {
            border: 2px solid red;
        }
    </style>
  </head>

  <body>

           id="tebakan"

    </button>
    
    <br />
    
    <canvas id="canvas"></canvas>
    
    <p>
      <span class="label">
        Skor:
      </span>

        0
      </span>

      <br />

      <span class="label">
        Level: 
      </span>
      <span id="level">
        1
      </span>
    </p>

    <script src="game.js"></script>
  </body>
</html>
