<!DOCTYPE html>
<html>
  <head>
    <title>Game tebak gambar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="game.css" />
  </head>

  <body>
    <div class="container-game">
      <div class="game-title">Game Tebak Gambar</div>

      <div class="game-body">
        <div class="container-gambar">
          <canvas id="canvas"></canvas>
        </div>

        <div>
          <div class="container-isian">
            <input type="text" id="tebakan" placeholder="Tulis tebakanmu..." />

            <button id="tombol" onclick="cekJawaban()">tebak</button>
          </div>

          <div class="game-statistik">
            <div>
              <div class="label">Skor:</div>
              <div class="value" id="skor"></div>
            </div>

            <div>
              <div class="label">High Skor:</div>
              <div class="value" id="high-skor"></div>
            </div>

            <div>
              <div class="label">Level:</div>
              <div class="value" id="level"></div>
            </div>

            <div>
              <div class="label">Nyawa:</div>
              <div class="value" id="nyawa"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="feedback-message"></div>

    <script src="game.js"></script>
  </body>
</html>
